name: Daily Wallpaper Pack Agent

on:
  schedule:
    - cron: "10 2 * * *" # 曼谷时间 09:10
  workflow_dispatch:
    inputs:
      city:
        description: "Optional city slug, e.g. tokyo"
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate-wallpaper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openai pillow

      - name: Prepare daily travel topic
        working-directory: travel-agent
        run: |
          RUN_DATE=$(TZ=Asia/Bangkok date +%F-%H%M)
          python scripts/pick_topic.py --date "$RUN_DATE"
          python scripts/generate_post.py --date "$RUN_DATE"
          echo "RUN_DATE=$RUN_DATE" >> "$GITHUB_ENV"

      - name: Generate wallpaper pack
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "${{ inputs.city }}" ]; then
            WALLPAPER_DIR=$(python modules/wallpaper/scripts/generate_wallpaper_pack.py --date "$RUN_DATE" --city "${{ inputs.city }}")
          else
            WALLPAPER_DIR=$(python modules/wallpaper/scripts/generate_wallpaper_pack.py --date "$RUN_DATE")
          fi
          python modules/wallpaper/scripts/make_preview_grid.py --output-dir "$WALLPAPER_DIR"
          python modules/wallpaper/scripts/generate_product_page.py --output-dir "$WALLPAPER_DIR"
          python modules/wallpaper/scripts/package_wallpaper_zip.py --output-dir "$WALLPAPER_DIR"

      - name: Commit wallpaper output
        run: |
          git config user.name "wallpaper-agent"
          git config user.email "agent@example.com"
          git add outputs/ travel-agent/outputs/
          git commit -m "Generate daily wallpaper pack" || echo "No changes"
          git push
