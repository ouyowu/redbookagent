<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>消息页 — 匹克约球</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=DM+Sans:wght@400;700;900&display=swap">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
body { font-family: 'ZCOOL QingKe HuangYou','PingFang SC',sans-serif; background: #1A2A35; display: flex; padding: 40px; justify-content: center; }

.phone { width: 375px; height: 812px; background: #F5F6FF; border-radius: 44px; overflow: hidden; box-shadow: 0 28px 80px rgba(0,0,0,0.55); display: flex; flex-direction: column; }

/* Header */
.msg-hd { background: linear-gradient(160deg, #6CCFF0, #4BADD8); padding: 44px 16px 12px; display: flex; align-items: flex-end; justify-content: space-between; flex-shrink: 0; }
.msg-hd-left { flex: 1; }
.msg-hd-title { display: block; font-size: 26px; font-weight: 900; color: #FFF; margin-bottom: 3px; }
.msg-hd-date { display: block; font-size: 12px; color: rgba(255,255,255,0.8); }
.msg-hd-edit { font-size: 12px; color: rgba(255,255,255,0.9); padding: 4px 10px; background: rgba(255,255,255,0.18); border-radius: 10px; border: 1px solid rgba(255,255,255,0.3); flex-shrink: 0; }

/* Unread hero */
.unread-hero { display: flex; align-items: center; gap: 10px; padding: 16px 14px 8px; background: #F5F6FF; flex-shrink: 0; }
.uh-num { font-size: 52px; font-weight: 900; color: #0D0D1A; line-height: 1; font-family: 'DM Sans', sans-serif; }
.uh-label { display: block; font-size: 14px; font-weight: 700; color: #0D0D1A; }
.uh-sub { display: block; font-size: 11px; color: #888; }

/* Scroll */
.scroll { flex: 1; overflow-y: auto; }
.scroll::-webkit-scrollbar { display: none; }

/* Group */
.msg-group { padding: 0 10px 4px; }
.mg-label { display: block; font-size: 11px; font-weight: 700; color: #9AAABB; letter-spacing: 0.5px; margin-bottom: 6px; padding-left: 2px; }

/* Color cards */
.msg-color-card { border-radius: 12px; padding: 12px; margin-bottom: 8px; }
.c-lavender { background: #E4E0FF; }
.c-mint     { background: #C8F7EE; }
.c-yellow   { background: #E8FFB8; }

.mcc-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.mcc-icon { width: 28px; height: 28px; background: rgba(255,255,255,0.55); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.mcc-time { font-size: 10px; color: rgba(0,0,0,0.4); }
.mcc-title { display: block; font-size: 16px; font-weight: 900; color: #0D0D1A; margin-bottom: 4px; }
.mcc-body { display: block; font-size: 12px; color: #444; line-height: 1.5; }

/* White read card */
.read-card { background: #FFF; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 8px rgba(0,50,120,0.06); margin-bottom: 8px; }
.read-row { display: flex; align-items: center; gap: 8px; padding: 11px 12px; }
.read-row.rr-border { border-bottom: 1px solid #F2F4FC; }
.rr-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; opacity: 0.7; }
.rr-icon.system { background: #E3F4FB; }
.rr-icon.review { background: #FFF8E1; }
.rr-icon.approved { background: #E8F5E9; }
.rr-body { flex: 1; min-width: 0; }
.rr-top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3px; }
.rr-title { font-size: 13px; font-weight: 600; color: #666; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 5px; }
.rr-time { font-size: 10px; color: #BBB; white-space: nowrap; font-family: 'DM Sans', sans-serif; }
.rr-preview { display: block; font-size: 11px; color: #AAA; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Tab bar */
.tab-bar { height: 56px; background: #FFF; border-top: 1px solid #ECEEF8; display: flex; align-items: center; justify-content: space-around; flex-shrink: 0; padding-bottom: 4px; }
.tb-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.tb-icon { font-size: 20px; }
.tb-label { font-size: 10px; color: #8B8FA8; }
.tb-item.active .tb-label { color: #4BADD8; font-weight: 700; }
.tb-fab { width: 44px; height: 44px; background: #0D0D1A; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #FFF; box-shadow: 0 4px 14px rgba(0,0,0,0.25); }
</style>
</head>
<body>
<div class="phone">
  <div class="msg-hd">
    <div class="msg-hd-left">
      <span class="msg-hd-title">消息</span>
      <span class="msg-hd-date">5月25日 周日</span>
    </div>
    <div class="msg-hd-edit">编辑</div>
  </div>

  <div class="unread-hero">
    <span class="uh-num">2</span>
    <div><span class="uh-label">条未读消息</span><span class="uh-sub">请及时处理</span></div>
  </div>

  <div class="scroll">
    <div class="msg-group">
      <span class="mg-label">未读</span>
      <div class="msg-color-card c-lavender">
        <div class="mcc-top">
          <div class="mcc-icon">🙋</div>
          <span class="mcc-time">10:24</span>
        </div>
        <span class="mcc-title">网球王子 申请加入球局</span>
        <span class="mcc-body">周末友谊赛·四人单打 — 求带，愿意补位！</span>
      </div>
      <div class="msg-color-card c-mint">
        <div class="mcc-top">
          <div class="mcc-icon">🔔</div>
          <span class="mcc-time">09:15</span>
        </div>
        <span class="mcc-title">系统通知</span>
        <span class="mcc-body">你的球局「高手切磋」已获 3 人报名，还差 1 人</span>
      </div>
    </div>

    <div class="msg-group">
      <span class="mg-label">已读</span>
      <div class="read-card">
        <div class="read-row rr-border">
          <div class="rr-icon review">⭐</div>
          <div class="rr-body">
            <div class="rr-top-row"><span class="rr-title">快手小陈 评价了你</span><span class="rr-time">昨天</span></div>
            <span class="rr-preview">对方给你 +5 信用分，感谢友谊赛！</span>
          </div>
        </div>
        <div class="read-row rr-border">
          <div class="rr-icon approved">✅</div>
          <div class="rr-body">
            <div class="rr-top-row"><span class="rr-title">申请已通过</span><span class="rr-time">5月23日</span></div>
            <span class="rr-preview">你已成功加入「朝阳公园早场」球局</span>
          </div>
        </div>
        <div class="read-row">
          <div class="rr-icon system">🔔</div>
          <div class="rr-body">
            <div class="rr-top-row"><span class="rr-title">每周挑战</span><span class="rr-time">5月20日</span></div>
            <span class="rr-preview">本周约球达人 Top 10 已更新，你排第 5！</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tb-item"><span class="tb-icon">🏠</span><span class="tb-label">首页</span></div>
    <div class="tb-item"><span class="tb-icon">🏸</span><span class="tb-label">球局</span></div>
    <div class="tb-fab">+</div>
    <div class="tb-item active"><span class="tb-icon">💬</span><span class="tb-label" style="color:#4BADD8">消息</span></div>
    <div class="tb-item"><span class="tb-icon">👤</span><span class="tb-label">我的</span></div>
  </div>
</div>
</body>
</html>
